services:
  - type: web
    name: nexacargo-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      # IMPORTANT: Set DATABASE_URL manually in the Render dashboard.
      # Use: postgresql+asyncpg://postgres:PASSWORD@db.PROJECT.supabase.co:5432/postgres
      - key: DATABASE_URL
        sync: false
      # Set manually in Render dashboard (Project Settings → API → anon key)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "*"
      - key: APP_NAME
        value: NexaCargo API
      - key: VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "False"
      - key: DB_SSL_VERIFY
        value: "True"
      - key: UPLOAD_DIR
        value: uploads
